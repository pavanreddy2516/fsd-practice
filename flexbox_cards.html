<!DOCTYPE html>
<html>

<head>
    <style>
    .container
    {
        display: flex;
        flex-direction: row;
        gap: 20px;
        justify-content: center;
        align-items: center;
        min-height: 400px;
        flex-wrap: wrap;
    }

    .card
    {
        flex-grow: 1;
        flex-shrink: 1;
        border: 2px solid black;
        padding: 5px;
    }
    </style>
</head>

<body>
    <div class="container">
    <div class="card">
        <h2>Card 1</h2>
        <p>Web Development</p>
    </div>

    <div class="card">
        <h2>Card 2</h2>
        <p>Cybersecurity</p>
    </div>

    <div class="card">
        <h2>Card 3</h2>
        <p>Python</p>
    </div>
    </div>
</body>

</html>
